[project]
name = "ai-stocks"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "sqlalchemy>=2.0.40,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
]
[dependency-groups]
dev=["pytest>=8.4,<9","pytest-cov>=6.2,<7","ruff>=0.12,<1","bandit>=1.8,<2"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q --strict-markers"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:unclosed database:ResourceWarning",
]
[tool.ruff]
line-length=100
[tool.ruff.lint]
select=["E","F","I","B","UP","S"]
ignore=["S101", "B008", "E501"]

[build-system]
requires=["hatchling"]
build-backend="hatchling.build"

[tool.ruff.lint.per-file-ignores]
"tests/*"=["S106","S603","S607","B017"]
