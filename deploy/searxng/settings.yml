use_default_settings:
  engines:
    keep_only:
      - bing

engines:
  - name: bing
    disabled: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "ai-stocks-internal-search-no-public-session"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  formats:
    - html
    - json
