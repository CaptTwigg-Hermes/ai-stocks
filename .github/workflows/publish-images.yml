name: Publish Dockge images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dockge-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AISTOCKS_TEST_DATABASE_URL: Host=localhost;Port=5432;Database=ai_stocks_test;Username=aistocks_test;Password=aistocks_test
      TEST_POSTGRES_URL: postgresql+psycopg://aistocks_test:aistocks_test@localhost:5432/ai_stocks_test
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: ai_stocks_test
          POSTGRES_USER: aistocks_test
          POSTGRES_PASSWORD: aistocks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aistocks_test -d ai_stocks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Bootstrap disposable PostgreSQL roles
        run: |
          docker run --rm --network host -e PGPASSWORD=aistocks_test -v "$PWD:/src:ro" \
            postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193 psql -h 127.0.0.1 -U aistocks_test -d postgres \
            --set ON_ERROR_STOP=1 --file /src/tests/postgres/bootstrap.sql

      - name: Build and test .NET solution
        run: |
          docker run --rm --network host -e AISTOCKS_TEST_DATABASE_URL -v "$PWD:/src" -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0-noble@sha256:72dd743782f2ae7e5476fd64f6a460045e3998dc862218b80e6944cba79a01b0 \
            bash -ec 'dotnet restore AiStocks.slnx --locked-mode && dotnet build AiStocks.slnx -c Release --no-restore && dotnet test AiStocks.slnx -c Release --no-build --no-restore'

      - name: Set up host .NET SDK for executable inventory probes
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x

      - name: Run Python and negative-capability gates
        run: |
          python3 -m pip install uv==0.12.3
          uv run pytest -q
          uv run python scripts/prove_no_broker.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, ui, exhibition, app, collector, worker, reporter, operations, backup-operations]
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.target }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/capttwigg-hermes/ai-stocks:${{ matrix.target }}-latest
            ghcr.io/capttwigg-hermes/ai-stocks:${{ matrix.target }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
