name: ai-stocks

x-runtime-security: &runtime-security
  read_only: true
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped
  stop_grace_period: 30s

services:
  app:
    <<: *runtime-security
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set the external ai_stocks PostgreSQL URL in .env}
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:?set the exact Cloudflare Access team domain in .env}
      ACCESS_AUD: ${ACCESS_AUD:?set this Access application exact AUD in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set the exact public HTTPS origin in .env}
      ACCESS_OWNER_EMAILS: ${ACCESS_OWNER_EMAILS:?set the owner email allowlist in .env}
      ACCESS_ALLOW_ANY_AUTHENTICATED_VIEWER: ${ACCESS_ALLOW_ANY_AUTHENTICATED_VIEWER:-false}
      ACCESS_VIEWER_EMAILS: ${ACCESS_VIEWER_EMAILS:-}
      TZ: Europe/Stockholm
    ports:
      - "${APP_BIND_ADDRESS:-192.168.50.2}:${APP_PORT:-3232}:8000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [egress]

  collector:
    <<: *runtime-security
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["python", "-m", "ai_stocks.collector"]
    environment:
      ARCHIVE_PATH: /data/nasdaq
      COLLECTOR_POLL_SECONDS: ${COLLECTOR_POLL_SECONDS:-15}
      TZ: Europe/Stockholm
    volumes:
      - ${NASDAQ_ARCHIVE_DIR:?set a UID-10001 writable Nasdaq archive dataset}:/data/nasdaq
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    networks: [egress]
    healthcheck:
      test: ["CMD", "python", "-m", "ai_stocks.health", "collector"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s

  worker:
    <<: *runtime-security
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    command: ["python", "-m", "ai_stocks.worker_cli"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set the external ai_stocks PostgreSQL URL in .env}
      HERMES_HOME: /run/hermes-auth
      NASDAQ_UNIVERSE_PATH: /app/config/nasdaq-stockholm-main-market-universe.json
      NASDAQ_STATUS_PATH: /data/status/status.json
      NASDAQ_ARCHIVE_PATH: /data/nasdaq
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      TZ: Europe/Stockholm
    volumes:
      - ${HERMES_AUTH_DIR:?set a UID-10001 private Hermes auth directory}:/run/hermes-auth
      - ${NASDAQ_ARCHIVE_DIR:?set the Nasdaq archive dataset}:/data/nasdaq:ro
      - ${NASDAQ_STATUS_DIR:?set the verified Nasdaq status dataset}:/data/status:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    networks: [egress]
    healthcheck:
      test: ["CMD", "python", "-m", "ai_stocks.health", "worker"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s

  migrate:
    <<: *runtime-security
    profiles: ["operations"]
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["/app/migrate.sh"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set the external ai_stocks PostgreSQL URL in .env}
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:?set the exact Cloudflare Access team domain in .env}
      ACCESS_AUD: ${ACCESS_AUD:?set this Access application exact AUD in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set the exact public HTTPS origin in .env}
      ACCESS_OWNER_EMAILS: ${ACCESS_OWNER_EMAILS:?set the owner email allowlist in .env}
      ACCESS_ALLOW_ANY_AUTHENTICATED_VIEWER: ${ACCESS_ALLOW_ANY_AUTHENTICATED_VIEWER:-false}
      ACCESS_VIEWER_EMAILS: ${ACCESS_VIEWER_EMAILS:-}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    restart: "no"
    networks: [egress]

  backup-tools:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    profiles: ["operations"]
    environment:
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?set the libpq ai_stocks PostgreSQL URL in .env}
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1770
    networks: [egress]

networks:
  egress: {}
