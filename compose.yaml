name: ai-stocks

x-runtime-security: &runtime-security
  read_only: true
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped
  stop_grace_period: 30s

services:
  contest-guard:
    <<: *runtime-security
    profiles: ["contest"]
    image: ${AISTOCKS_IMAGE_REPOSITORY:-ghcr.io/capttwigg-hermes/ai-stocks}:operations-${AISTOCKS_IMAGE_VERSION:-latest}
    entrypoint: ["/bin/sh", "-ec"]
    command: ['test "$$AISTOCKS_DEPLOYMENT_PROFILE" = "contest"']
    environment:
      AISTOCKS_DEPLOYMENT_PROFILE: ${AISTOCKS_DEPLOYMENT_PROFILE:?set to contest or preview}
    restart: "no"

  preview-guard:
    <<: *runtime-security
    profiles: ["preview"]
    image: ${AISTOCKS_IMAGE_REPOSITORY:-ghcr.io/capttwigg-hermes/ai-stocks}:operations-${AISTOCKS_IMAGE_VERSION:-latest}
    entrypoint: ["/bin/sh", "-ec"]
    command: ['test "$$AISTOCKS_DEPLOYMENT_PROFILE" = "preview"']
    environment:
      AISTOCKS_DEPLOYMENT_PROFILE: ${AISTOCKS_DEPLOYMENT_PROFILE:?set to contest or preview}
    restart: "no"

  app:
    <<: *runtime-security
    profiles: ["contest"]
    depends_on:
      contest-guard:
        condition: service_completed_successfully
    image: ${AISTOCKS_IMAGE_REPOSITORY:-ghcr.io/capttwigg-hermes/ai-stocks}:app-${AISTOCKS_IMAGE_VERSION:-latest}
    environment:
      APP_ENV: production
      DATABASE_URL: ${WEB_DATABASE_URL:?set the read-only web PostgreSQL URL}
      TZ: Europe/Stockholm
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:?set the exact Cloudflare Access team domain}
      ACCESS_AUD: ${ACCESS_AUD:?set the exact Access application AUD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set the exact public HTTPS origin}
      ACCESS_OWNER_EMAILS: ${ACCESS_OWNER_EMAILS:?set the owner email allowlist}
      ACCESS_VIEWER_EMAILS: ${ACCESS_VIEWER_EMAILS:?set the viewer email allowlist}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?set the exact trusted reverse-proxy IP addresses}
    ports:
      - "${APP_BIND_ADDRESS:-192.168.50.2}:${APP_PORT:-3232}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [egress]

  api:
    <<: *runtime-security
    profiles: ["preview"]
    depends_on:
      preview-guard:
        condition: service_completed_successfully
    image: ${AISTOCKS_IMAGE_REPOSITORY:-ghcr.io/capttwigg-hermes/ai-stocks}:api-${AISTOCKS_IMAGE_VERSION:-latest}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PREVIEW_MODE: "1"
      TZ: Europe/Stockholm
      UI_ORIGINS: ${PREVIEW_UI_ORIGINS:-http://192.168.50.2:3232}
    ports:
      - "${API_BIND_ADDRESS:-192.168.50.2}:${API_PORT:-3233}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [egress]

  ui:
    <<: *runtime-security
    profiles: ["preview"]
    depends_on:
      preview-guard:
        condition: service_completed_successfully
    image: ${AISTOCKS_IMAGE_REPOSITORY:-ghcr.io/capttwigg-hermes/ai-stocks}:ui-${AISTOCKS_IMAGE_VERSION:-latest}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TZ: Europe/Stockholm
      API_PUBLIC_ORIGIN: ${PREVIEW_API_ORIGIN:-http://192.168.50.2:3233}
    ports:
      - "${APP_BIND_ADDRESS:-192.168.50.2}:${APP_PORT:-3232}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [egress]

  collector:
    <<: *runtime-security
    profiles: ["contest"]
    depends_on:
      contest-guard:
        condition: service_completed_successfully
    image: ${AISTOCKS_IMAGE_REPOSITORY:-ghcr.io/capttwigg-hermes/ai-stocks}:collector-${AISTOCKS_IMAGE_VERSION:-latest}
    environment:
      APP_ENV: production
      COLLECTOR_DATABASE_URL: ${COLLECTOR_DATABASE_URL:?set the least-privilege collector PostgreSQL URL}
      ARCHIVE_PATH: /data/nasdaq
      FIRDS_ACQUISITION_PLAN_PATH: /run/market-bootstrap/firds-plan.json
      CORPORATE_ACTION_INPUT_PATH: /run/corporate-actions
      COLLECTOR_POLL_SECONDS: ${COLLECTOR_POLL_SECONDS:-15}
      COLLECTOR_MAX_DOWNLOADS_PER_POLL: ${COLLECTOR_MAX_DOWNLOADS_PER_POLL:-32}
      COLLECTOR_CONFLICT_REFETCH_MINUTES: ${COLLECTOR_CONFLICT_REFETCH_MINUTES:-360}
      TZ: Europe/Stockholm
    volumes:
      - ${NASDAQ_ARCHIVE_DIR:?set a UID-10001 writable Nasdaq archive dataset}:/data/nasdaq
      - ${MARKET_BOOTSTRAP_DIR:?set the reviewed FIRDS plan directory}:/run/market-bootstrap:ro
      - ${CORPORATE_ACTION_INPUT_DIR:?set the reviewed corporate-action input directory}:/run/corporate-actions:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks: [egress]

  worker:
    <<: *runtime-security
    profiles: ["contest"]
    depends_on:
      contest-guard:
        condition: service_completed_successfully
    image: ${AISTOCKS_IMAGE_REPOSITORY:-ghcr.io/capttwigg-hermes/ai-stocks}:worker-${AISTOCKS_IMAGE_VERSION:-latest}
    environment:
      APP_ENV: production
      DATABASE_URL: ${WORKER_DATABASE_URL:?set the trading worker PostgreSQL URL}
      TZ: Europe/Stockholm
      HERMES_HOME: /run/hermes-auth
      HERMES_EXECUTABLE: /opt/hermes/bin/hermes
      NASDAQ_ARCHIVE_PATH: /data/nasdaq
      NASDAQ_STATUS_PATH: /data/status
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
    volumes:
      - ${HERMES_AUTH_DIR:?set a UID-10001 private Hermes auth directory}:/run/hermes-auth:ro
      - ${NASDAQ_ARCHIVE_DIR:?set the Nasdaq archive dataset}:/data/nasdaq:ro
      - ${NASDAQ_STATUS_DIR:?set the verified Nasdaq status dataset}:/data/status:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks: [egress]

  reporter:
    <<: *runtime-security
    profiles: ["contest"]
    depends_on:
      contest-guard:
        condition: service_completed_successfully
    image: ${AISTOCKS_IMAGE_REPOSITORY:-ghcr.io/capttwigg-hermes/ai-stocks}:reporter-${AISTOCKS_IMAGE_VERSION:-latest}
    environment:
      APP_ENV: production
      DATABASE_URL: ${OPERATIONS_DATABASE_URL:?set the operations PostgreSQL URL}
      TZ: Europe/Stockholm
      HERMES_HOME: /run/hermes-auth
      HERMES_EXECUTABLE: /opt/hermes/bin/hermes
      DISCORD_REPORT_TARGET: "${DISCORD_REPORT_TARGET:?set the numeric Hermes Discord target}"
      OPERATIONS_POLL_SECONDS: ${OPERATIONS_POLL_SECONDS:-30}
    volumes:
      - ${HERMES_AUTH_DIR:?set a UID-10001 private Hermes auth directory}:/run/hermes-auth:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    networks: [egress]

  migrate:
    <<: *runtime-security
    profiles: ["operations"]
    image: ${AISTOCKS_IMAGE_REPOSITORY:-ghcr.io/capttwigg-hermes/ai-stocks}:operations-${AISTOCKS_IMAGE_VERSION:-latest}
    command: ["migrate"]
    environment:
      APP_ENV: production
      MIGRATOR_DATABASE_URL: ${MIGRATOR_DATABASE_URL:?set the privileged migrator PostgreSQL URL}
      DATABASE_URL: ${OPERATIONS_DATABASE_URL:?set the operations PostgreSQL URL}
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:?set the exact Cloudflare Access team domain}
      ACCESS_AUD: ${ACCESS_AUD:?set the exact Access application AUD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set the exact public HTTPS origin}
      ACCESS_OWNER_EMAILS: ${ACCESS_OWNER_EMAILS:?set the owner email allowlist}
      ACCESS_VIEWER_EMAILS: ${ACCESS_VIEWER_EMAILS:?set the viewer email allowlist}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    restart: "no"
    networks: [egress]

  backup-tools:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    profiles: ["operations"]
    environment:
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?set the libpq backup PostgreSQL URL}
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1770
    networks: [egress]

  backup-scheduler:
    image: ${AISTOCKS_IMAGE_REPOSITORY:-ghcr.io/capttwigg-hermes/ai-stocks}:backup-operations-${AISTOCKS_IMAGE_VERSION:-latest}
    profiles: ["operations"]
    environment:
      AISTOCKS_BACKUP_IN_CONTAINER: "1"
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?set the restricted backup PostgreSQL URL}
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:?set the disposable ai_stocks_test restore URL}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_DIR: /backups
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup-passphrase
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ${BACKUP_PASSPHRASE_FILE:-./secrets/backup-passphrase}:/run/secrets/backup-passphrase:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1770
    restart: unless-stopped
    networks: [egress]

networks:
  egress: {}
