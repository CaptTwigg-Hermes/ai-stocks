name: ai-stocks

x-runtime-security: &runtime-security
  read_only: true
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped
  stop_grace_period: 30s

services:
  app:
    <<: *runtime-security
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    environment:
      APP_ENV: production
      DATABASE_URL: ${WEB_DATABASE_URL:?set the read-only web PostgreSQL URL}
      TZ: Europe/Stockholm
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:?set the exact Cloudflare Access team domain}
      ACCESS_AUD: ${ACCESS_AUD:?set the exact Access application AUD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set the exact public HTTPS origin}
      ACCESS_OWNER_EMAILS: ${ACCESS_OWNER_EMAILS:?set the owner email allowlist}
      ACCESS_VIEWER_EMAILS: ${ACCESS_VIEWER_EMAILS:?set the viewer email allowlist}
    ports:
      - "${APP_BIND_ADDRESS:-192.168.50.2}:${APP_PORT:-3232}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [egress]

  collector:
    <<: *runtime-security
    build:
      context: .
      dockerfile: Dockerfile
      target: collector
    environment:
      APP_ENV: production
      COLLECTOR_DATABASE_URL: ${COLLECTOR_DATABASE_URL:?set the least-privilege collector PostgreSQL URL}
      ARCHIVE_PATH: /data/nasdaq
      STATUS_PINNED_KEY_ID: ${STATUS_PINNED_KEY_ID:?set the reviewed status seed signer key ID}
      COLLECTOR_POLL_SECONDS: ${COLLECTOR_POLL_SECONDS:-15}
      TZ: Europe/Stockholm
    volumes:
      - ${NASDAQ_ARCHIVE_DIR:?set a UID-10001 writable Nasdaq archive dataset}:/data/nasdaq
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks: [egress]

  worker:
    <<: *runtime-security
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      APP_ENV: production
      DATABASE_URL: ${WORKER_DATABASE_URL:?set the trading worker PostgreSQL URL}
      TZ: Europe/Stockholm
      HERMES_HOME: /run/hermes-auth
      HERMES_EXECUTABLE: /opt/hermes/bin/hermes
      NASDAQ_ARCHIVE_PATH: /data/nasdaq
      NASDAQ_STATUS_PATH: /data/status
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
      DISCORD_TARGET: "${DISCORD_TARGET:?set the Hermes Discord delivery target}"
    volumes:
      - ${HERMES_AUTH_DIR:?set a UID-10001 private Hermes auth directory}:/run/hermes-auth:ro
      - ${NASDAQ_ARCHIVE_DIR:?set the Nasdaq archive dataset}:/data/nasdaq:ro
      - ${NASDAQ_STATUS_DIR:?set the verified Nasdaq status dataset}:/data/status:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
    networks: [egress]

  migrate:
    <<: *runtime-security
    profiles: ["operations"]
    build:
      context: .
      dockerfile: Dockerfile
      target: operations
    command: ["migrate"]
    environment:
      APP_ENV: production
      MIGRATOR_DATABASE_URL: ${MIGRATOR_DATABASE_URL:?set the privileged migrator PostgreSQL URL}
      DATABASE_URL: ${OPERATIONS_DATABASE_URL:?set the operations PostgreSQL URL}
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:?set the exact Cloudflare Access team domain}
      ACCESS_AUD: ${ACCESS_AUD:?set the exact Access application AUD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set the exact public HTTPS origin}
      ACCESS_OWNER_EMAILS: ${ACCESS_OWNER_EMAILS:?set the owner email allowlist}
      ACCESS_VIEWER_EMAILS: ${ACCESS_VIEWER_EMAILS:?set the viewer email allowlist}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1770
    restart: "no"
    networks: [egress]

  backup-tools:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    profiles: ["operations"]
    environment:
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?set the libpq backup PostgreSQL URL}
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1770
    networks: [egress]

  backup-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: backup-operations
    profiles: ["operations"]
    environment:
      AISTOCKS_BACKUP_IN_CONTAINER: "1"
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?set the restricted backup PostgreSQL URL}
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:?set the disposable ai_stocks_test restore URL}
      BACKUP_ALERT_WEBHOOK_URL: ${BACKUP_ALERT_WEBHOOK_URL:?set a private Discord failure webhook}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_DIR: /backups
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup-passphrase
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ${BACKUP_PASSPHRASE_FILE:-./secrets/backup-passphrase}:/run/secrets/backup-passphrase:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1770
    restart: unless-stopped
    networks: [egress]

networks:
  egress: {}
